<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo-list</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Список задач</h1>

    <form id="todo-form" class="todo-form" autocomplete="off">
      <input type="text" id="todo-input" placeholder="Что нужно сделать?">
      <button type="submit" id="add-btn">Добавить</button>
    </form>
    <p id="warning" class="warning" hidden>Введите текст задачи!</p>

    <p id="counter" class="counter">Осталось: 0, Выполнено: 0</p>

    <div class="filters">
      <button type="button" class="filter-btn active" data-filter="all">Все</button>
      <button type="button" class="filter-btn" data-filter="active">Активные</button>
      <button type="button" class="filter-btn" data-filter="completed">Завершённые</button>
    </div>

    <ul id="todo-list" class="todo-list"></ul>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
